# Render Blueprint — deploys the research agent from this repo.
# In Render: New + > Blueprint > pick this GitHub repo. Render reads this file.
# Then set GROQ_API_KEY and APP_PASSWORD as secret env vars in the dashboard.
services:
  - type: web
    name: research-agent
    runtime: python
    plan: free
    rootDir: research-agent           # the app lives in this subfolder
    buildCommand: pip install -r requirements.txt
    startCommand: python research_agent.py
    envVars:
      - key: GROQ_API_KEY             # your Groq key — mark as secret
        sync: false
      - key: APP_PASSWORD             # password to access the site — mark as secret
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.4"
